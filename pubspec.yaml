name: mdm
description: "YTDown — Flutter YouTube Downloader"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc:
  bloc:

  # Dependency Injection
  get_it:
  injectable:

  # Routing
  go_router:

  # Networking
  dio:

  # Code Generation (immutable models)
  freezed_annotation:
  json_annotation:

  # Local Database
  isar:
  isar_flutter_libs:

  # Secure preferences
  flutter_secure_storage:

  # YouTube metadata + stream extraction
  youtube_explode_dart:

  # FFmpeg
  ffmpeg_kit_flutter_new:

  # Video player
  better_player:

  # File & Storage
  path_provider:
  permission_handler:
  open_filex:

  # Share Intent
  receive_sharing_intent:

  # Device info
  device_info_plus:

  # UI & Image
  cached_network_image:
  shimmer:
  lottie:
  flutter_animate:
  lucide_icons:
  google_fonts:

  # Notifications
  flutter_local_notifications:

  # Utilities
  logger:
  equatable:
  rxdart:
  connectivity_plus:
  intl:
  uuid:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed:
  json_serializable:
  injectable_generator:
  build_runner:
  bloc_test:
  mocktail:

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
